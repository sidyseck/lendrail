[project]
name = "lendrail-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<0.116",
    "uvicorn[standard]>=0.30,<0.35",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29,<0.31",
    "alembic>=1.13,<1.15",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "email-validator>=2.1,<3.0",
    "pyjwt>=2.8,<3.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "bcrypt>=4.1,<5.0",
    "cryptography>=42.0,<44.0",
    "arq>=0.26,<0.27",
    "redis>=5.0,<6.0",
    "python-multipart>=0.0.9,<0.1",
    "structlog>=24.0,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.24,<0.26",
    "httpx>=0.27,<0.28",
    "ruff>=0.5,<0.7",
    "mypy>=1.10,<2.0",
    "asgi-lifespan>=2.1,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
